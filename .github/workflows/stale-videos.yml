# The download page's recordings are no older than two weeks (krizaka/.github#315), watched daily (krizaka-internal#3626). It was a unit test
# that read the clock: the day the newest recording turned 15 days old it failed every push and every PR, the repair of the recording
# workflow included. Staleness is a property of time: red files ONE alert `stale-videos/verikora` in the private krizaka-internal naming the
# stale ids (or comments on the open one), green closes it. Never required, so it cannot block a merge.
name: Stale videos

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Recordings younger than 14 days
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: report
        name: Read the manifest
        run: node scripts/stale-videos-report.mjs "$RUNNER_TEMP/stale-videos.md"
      - name: Raise the alert (stale ids) or clear it
        uses: krizaka/.github/actions/alert-issue@c291e5f3da409bc20e651d260316d5d9302cb2cc # main
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          title: "verikora · fix(ci): the download videos are older than 14 days (the recording job stopped publishing)"
          body-file: ${{ runner.temp }}/stale-videos.md
          labels: repo:verikora,type:fix
          alert-key: stale-videos/verikora
          state: ${{ steps.report.outputs.state }}
