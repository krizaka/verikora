# « Done » covers every surface of the product (krizaka/.github#439): a closed `feature` issue must have every surface ticked with a PR
# or marked `n/a — reason`, else it is reopened with a comment. The check is the org's (krizaka/.github feature-surfaces.yml).
name: Feature surfaces

on:
  issues:
    types: [closed]

permissions: {}

jobs:
  check:
    permissions:
      contents: read
      issues: write
    uses: krizaka/.github/.github/workflows/feature-surfaces.yml@5ca6ddf1842ab444dfd642059d0b7e61dba8abc5 # main
