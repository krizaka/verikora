name: Journeys

# The customer journeys (ADR-017, krizaka/.github#423) as the seeded cast: apps/web/e2e/journeys/journeys.json lists them, the
# kit is @krizaka/page-audit/journey. The same app, seed and Playwright container as the visual regression; retries are 0 and
# a flake is a bug. A required check of the merge queue (krizaka-internal#2380, the sealed-PDF journey): it reports on the queue
# entry too, as the visual regression does.
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  journeys:
    uses: krizaka/.github/.github/workflows/visual-regression.yml@84a22e72359caf315d8bf346f4a31cdb22f25997 # main (group-suffix, .github#434)
    permissions:
      contents: read
    with:
      package-manager: pnpm
      group-suffix: -journeys
      start-script: scripts/ci-visual-start.sh
      test-command: pnpm exec playwright test -c apps/web/e2e/journeys/playwright.config.mjs
      snapshot-paths: apps/web/e2e/journeys
      env: |
        DATABASE_URL=postgresql://ci:ci-only-password@postgres:5432/ci
        E2E_EMAIL=eric@demo.verikora.test
        MEDIA_DOCUMENTS_TENANT=verikora-ci
        E2E_PASSWORD=ci-only-demo-password-0123
