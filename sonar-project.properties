sonar.projectKey=krizaka_verikora
sonar.organization=krizaka
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/*.test.*,**/*.spec.*,**/__tests__/**,**/e2e/**,**/src/test/**,**/test/fixtures/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info,apps/*/coverage/lcov.info,packages/*/coverage/lcov.info
# The migrations are SQL text in a list: similar CREATE TABLE statements are not copied logic.
sonar.cpd.exclusions=apps/web/lib/migrations.ts

# Test files are tests, not sources: they never count as code to cover (the new-code coverage gate, founder
# decision 9, krizaka-internal#3490) and test rules apply to them. Same patterns are excluded from the sources above.
# Sources are the whole repository: SonarCloud takes every file for a test when `sonar.tests` is set and `sonar.sources` is not, and the
# main branch then has no ncloc (krizaka-internal#3567). Tests are removed from the sources by sonar.exclusions above.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/e2e/**,**/src/test/**,**/test/fixtures/**
