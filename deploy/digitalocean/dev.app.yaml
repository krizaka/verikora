# Verikora dev — DigitalOcean App Platform, project `verikora`, region tor (next to the cluster krizaka-dev-pg).
# The smallest service ($5/month). Secrets are filled at apply time (`__NAME__`, never committed) and stored as SECRET.
name: verikora-dev
region: tor
alerts:
  - rule: DEPLOYMENT_FAILED
domains:
  # The development address (krizaka-internal#2659): dev.verikora.com is the app; admin.verikora.com its console (same app, by host).
  # www.verikora.com and the apex are the public face, served by the production team (coming soon), never by this app.
  - domain: dev.verikora.com
    type: PRIMARY
  - domain: admin.verikora.com
    type: ALIAS
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web
services:
  - name: web
    dockerfile_path: deploy/docker/Dockerfile
    source_dir: /
    github:
      repo: krizaka/verikora
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/healthz
      initial_delay_seconds: 20
      period_seconds: 15
    envs:
      - { key: APP_PUBLIC_URL, scope: RUN_AND_BUILD_TIME, value: "https://dev.verikora.com" }
      # The stage (verikora#364): `dev` shows the « development version » notice on every screen; `prod` hides it. Read at build too (the pages are static).
      - { key: APP_ENVIRONMENT, scope: RUN_AND_BUILD_TIME, value: "dev" }
      # www is indexed (krizaka-com AGENTS §2.4): robots allows, sitemap, no noindex. dev. and admin. are closed by host (lib/indexing.ts).
      - { key: APP_SEARCH_INDEXING, scope: RUN_AND_BUILD_TIME, value: "on" }
      - { key: APP_COMMIT_SHA, scope: BUILD_TIME, value: "${_self.COMMIT_HASH}" }
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET, value: "__DATABASE_URL__" }
      # The database reached directly (not through the pooler): migrations and session advisory locks need one backend (lib/db.ts). Read at build too, as live.
      - { key: DATABASE_DIRECT_URL, scope: RUN_AND_BUILD_TIME, type: SECRET, value: "__DATABASE_DIRECT_URL__" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET, value: "__DATABASE_CA_CERT__" }
      - { key: AUTH_SESSION_SECRET, scope: RUN_TIME, type: SECRET, value: "__AUTH_SESSION_SECRET__" }
      - { key: AUTH_SIGNUP_ENABLED, scope: RUN_TIME, value: "false" }
      - { key: AUTH_ALLOWED_IPS, scope: RUN_TIME, type: SECRET, value: "__AUTH_ALLOWED_IPS__" }
      - { key: ABUSE_CLIENT_IP_HEADER, scope: RUN_TIME, value: "do-connecting-ip" }
      # Payments (ADR-0004): the vendor is a value, its keys SECRETS filled at apply time. Test keys until the owner switches to live.
      - { key: PAYMENTS_PROVIDER, scope: RUN_TIME, value: "stripe" }
      - { key: PAYMENTS_STRIPE_SECRET_KEY, scope: RUN_TIME, type: SECRET, value: __PAYMENTS_STRIPE_SECRET_KEY__ }
      - {
          key: PAYMENTS_STRIPE_WEBHOOK_SECRET,
          scope: RUN_TIME,
          type: SECRET,
          value: __PAYMENTS_STRIPE_WEBHOOK_SECRET__,
        }
      - { key: AI_PROVIDER, scope: RUN_TIME, value: "sovkora" }
      - { key: AI_API_URL, scope: RUN_TIME, value: "https://dev.sovkora.com/edge" }
      - { key: AI_API_KEY, scope: RUN_TIME, type: SECRET, value: "__AI_API_KEY__" }
      # The live app has these (krizaka-deploy refused an apply that would delete them): the report signing key is a SECRET, kept.
      - { key: APP_REPORT_SIGNING_KEY, scope: RUN_TIME, type: SECRET, value: "__APP_REPORT_SIGNING_KEY__" }
      - { key: APP_PUBLIC_ACTIONS, scope: RUN_TIME, value: "off" }
      - { key: DATABASE_MAX_CONNECTIONS, scope: RUN_TIME, value: "2" }
      # Kept documents in development (ADR-0007, krizaka/verikora#153): its own private Bunny zone (never the public media zone), signed
      # expiring links through its token-authenticated pull zone. Fictional data only; production uses a Canadian bucket.
      - { key: MEDIA_DOCUMENTS_PROVIDER, scope: RUN_TIME, value: "bunny" }
      - { key: MEDIA_STORAGE_ENDPOINT, scope: RUN_TIME, value: "ny.storage.bunnycdn.com" }
      - { key: MEDIA_STORAGE_ZONE, scope: RUN_TIME, value: "yomizaka-docs-dev" }
      - { key: MEDIA_STORAGE_API_KEY, scope: RUN_TIME, type: SECRET, value: "__MEDIA_STORAGE_API_KEY__" }
      - { key: MEDIA_DOCUMENTS_PULL_HOSTNAME, scope: RUN_TIME, value: "yomizaka-docs-dev.b-cdn.net" }
      - { key: MEDIA_DOCUMENTS_TOKEN_KEY, scope: RUN_TIME, type: SECRET, value: "__MEDIA_DOCUMENTS_TOKEN_KEY__" }
# The nightly encrypted backup and its restore drill (krizaka/verikora#513, docs/DISASTER_RECOVERY.md). A scheduled job INSIDE the app: it
# reaches the database with the same trusted connection as the web (no IP rule to open, krizaka-infra#24). It dumps one snapshot,
# restores it into a scratch database to compare every table's row count, age-encrypts to a PUBLIC key and writes to the admin's default
# provider for « backups » (Administration -> Storage; refused unless it is verified and in Canada). Retention 30 days, newest 7 always kept.
# The second job is the dead-man's switch: it fails when the newest backup is missing or older than 36 h. A failed run shows in the
# job's history and exits 1 with « BACKUP_FAILED <code> ». Written, not applied: the founder applies it (see the PR).
jobs:
  - name: backup
    kind: SCHEDULED
    schedule:
      cron: "15 3 * * *"
      time_zone: "America/Toronto"
    dockerfile_path: deploy/backup/Dockerfile
    source_dir: /
    github:
      repo: krizaka/verikora
      branch: main
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - { key: APP_ENVIRONMENT, scope: RUN_TIME, value: "dev" }
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET, value: "__DATABASE_URL__" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET, value: "__DATABASE_CA_CERT__" }
      # Opens the storage provider's sealed credentials (the same key as the web's). The age PRIVATE key is NOT here and never will be.
      - { key: MEDIA_VAULT_KEY, scope: RUN_TIME, type: SECRET, value: "__MEDIA_VAULT_KEY__" }
      - { key: BACKUP_AGE_RECIPIENT, scope: RUN_TIME, type: SECRET, value: "__BACKUP_AGE_RECIPIENT__" }
      - { key: BACKUP_RETENTION_DAYS, scope: RUN_TIME, value: "30" }
  - name: backup-freshness
    kind: SCHEDULED
    schedule:
      cron: "45 8 * * *"
      time_zone: "America/Toronto"
    dockerfile_path: deploy/backup/Dockerfile
    source_dir: /
    run_command: node deploy/backup/bin/backup.mjs check
    github:
      repo: krizaka/verikora
      branch: main
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: APP_ENVIRONMENT, scope: RUN_TIME, value: "dev" }
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET, value: "__DATABASE_URL__" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET, value: "__DATABASE_CA_CERT__" }
      - { key: MEDIA_VAULT_KEY, scope: RUN_TIME, type: SECRET, value: "__MEDIA_VAULT_KEY__" }
