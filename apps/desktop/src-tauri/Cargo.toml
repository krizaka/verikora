[package]
name = "verikora-desktop"
version = "0.1.0"
description = "Verikora for the Mac: a library in a folder of your Mac, documents checked and never kept elsewhere"
authors = ["Krizaka"]
edition = "2021"
license = "FSL-1.1-ALv2"
rust-version = "1.80"

[lib]
name = "verikora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-krizaka = { version = "0.4", git = "https://github.com/krizaka/krizaka-rust", tag = "v0.4.0" }
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# The embedded W3C WebDriver of the Mac journey (verikora#636): debug builds with `--features webdriver` only, never a release.
tauri-plugin-webdriver = { version = "0.2.3", optional = true }

[features]
webdriver = ["dep:tauri-plugin-webdriver"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
